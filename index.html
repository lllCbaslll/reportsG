<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Certificado GPS</title>
<style>
.cgps{font-family:Roboto,Arial,sans-serif;font-size:13px;color:#2c3e50;padding:16px;max-width:1100px}
.cgps h2{margin:0 0 4px;font-size:20px}.cgps h3{margin:18px 0 6px;font-size:15px}
.cgps .cgps-muted{color:#7a8794;font-weight:400}
.cgps .cgps-row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:10px 0}
.cgps input[type=text],.cgps select{padding:6px 8px;border:1px solid #c5ccd3;border-radius:4px;font-size:13px}
.cgps button{padding:8px 16px;border:1px solid #0078d3;background:#fff;color:#0078d3;border-radius:4px;font-size:13px;cursor:pointer}
.cgps button.cgps-primary{background:#0078d3;color:#fff}
.cgps button:hover{opacity:.88}
.cgps .cgps-box{max-height:340px;overflow:auto;border:1px solid #d9dee3;border-radius:4px}
.cgps table{border-collapse:collapse;width:100%}
.cgps th,.cgps td{border:1px solid #d9dee3;padding:5px 8px;text-align:left}
.cgps thead th{background:#eef2f6;position:sticky;top:0}
.cgps .cgps-tbl{width:auto;min-width:560px;margin-bottom:8px}
.cgps .cgps-tbl th,.cgps .cgps-tbl td{text-align:center}
.cgps .cgps-msg{margin:8px 0;min-height:18px;color:#1f6e43}.cgps .cgps-err{color:#c0392b}
</style>
</head>
<body>

<div class="cgps" id="cgps-root">
  <h2>Certificado GPS</h2>
  <div class="cgps-muted">Seleccione los activos (placas) de la base de datos, visualice la tabla y genere el Anexo N°01 en Word.</div>
  <div class="cgps-row">
    <input type="text" id="cgps-filter" placeholder="Buscar placa, VIN o raz&oacute;n social&hellip;" size="38">
    <button id="cgps-sel-vis" type="button">Seleccionar visibles</button>
    <button id="cgps-sel-none" type="button">Limpiar selecci&oacute;n</button>
    <label><input type="checkbox" id="cgps-inactive"> Incluir activos inactivos</label>
  </div>
  <div class="cgps-row">
    <label>Raz&oacute;n social desde:
      <select id="cgps-mode">
        <option value="auto">Autom&aacute;tico (propiedad personalizada &rarr; comentario &rarr; grupo)</option>
        <option value="comment">Comentario del activo</option>
        <option value="group">Grupo del activo</option>
        <option value="property">Propiedad personalizada&hellip;</option>
      </select>
    </label>
    <input type="text" id="cgps-propname" placeholder="Nombre de la propiedad" style="display:none">
    <label>Si no se detecta, usar: <input type="text" id="cgps-manual" placeholder="RAZON SOCIAL" size="30"></label>
  </div>
  <div class="cgps-box"><table>
    <thead><tr><th style="width:34px"></th><th>Placa</th><th>VIN</th><th>Activo desde</th><th>Raz&oacute;n social</th></tr></thead>
    <tbody id="cgps-listbody"><tr><td colspan="5" class="cgps-muted">Cargando&hellip;</td></tr></tbody>
  </table></div>
  <div class="cgps-muted" id="cgps-count" style="margin:6px 0"></div>
  <div class="cgps-row">
    <button id="cgps-btn-view" type="button" class="cgps-primary">Visualizar tabla</button>
    <button id="cgps-btn-doc" type="button" class="cgps-primary">Generar Word</button>
  </div>
  <div id="cgps-msg" class="cgps-msg"></div>
  <div id="cgps-preview"></div>
</div>

<script>
